# Roblox Trend Tracker settings. Edit freely; every run re-reads this file.

[collect]
# Charts ("sorts") are pulled for each device. Phones are most of the audience, and every
# chart request uses up some of Roblox's search allowance, so phone only.
devices = ["high_end_phone"]
country = "all"

# Each query is run through Roblox search; results are where most of the
# small games (the flops) come from. Keep it to the genre you care about.
search_pages = 2          # 40 results per page
queries = [
  # current lineage words
  "steal a", "steal an egg", "steal a brainrot", "for brainrots", "for animals",
  "for eggs", "egg", "pets", "animals", "grow a", "garden",
  "+1 speed", "keyboard escape", "tsunami", "lava",
  "throw", "kick", "launch", "catch", "hatch", "train", "treadmill",
  "lucky block", "break and steal", "ride a", "fish", "mine", "dig",
  # generic genre words
  "tycoon", "simulator", "incremental", "idle", "rng", "merge", "brainrot",
  # current non-tycoon risers worth watching for loops to borrow
  "dont splash", "survive", "escape",
]

# Keep refreshing a game while it has at least this many players, or while it
# was first seen less than `keep_new_days` ago, or while it is on the watchlist.
min_track_playing = 25
keep_new_days = 30

[alerts]
# Player-count thresholds that create a "crossed" event the first time a game passes them.
thresholds = [1000, 10000, 100000, 1000000]
# Charts whose first appearance of a game creates an "entered chart" event.
sorts = ["up-and-coming", "top-trending", "trending-in-simulation", "top-playing-now"]
# macOS notifications: only for games younger than this many days...
notify = true
notify_max_age_days = 60
# ...that cross one of these thresholds.
notify_thresholds = [10000, 100000, 1000000]

[report]
breakout_max_age_days = 45   # "new game" window for the breakout list
breakout_min_peak = 1000     # ignore anything smaller
lineage_genres = ["Simulation"]   # genre_l1 values treated as "this genre"

# Watchlist seeds. Add more here or with:  python3 -m tracker watch add <id or name> "note"
